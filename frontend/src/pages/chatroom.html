<!DOCTYPE html>
<html>
<head>
    <title>Chatroom</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link href="/styles/dark-style.css" rel="stylesheet">

    <link href="../favicon/favicon-96x96.png" rel="icon" sizes="96x96" type="image/png"/>
    <link href="../favicon/favicon.svg" rel="icon" type="image/svg+xml"/>
    <link href="../favicon/favicon.ico" rel="shortcut icon"/>
    <link href="../favicon/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/>
    <meta content="MyWebSite" name="apple-mobile-web-app-title"/>
    <link href="../favicon/site.webmanifest" rel="manifest"/>
</head>
<body>
<div id="navbar"></div>
<script>
  fetch('/components/navbar.html')
    .then(res => res.text())
    .then(html => document.getElementById('navbar').innerHTML = html);
</script>

<h1>Hello</h1>
<p id="message-box">Work in progress...</p>
<button onclick="socket.send(JSON.stringify({message: 'button pressed'}))">Reload</button>

<script>
  let waitTime = 1000;

  function connect() {
    const socket = new WebSocket('wss://dungewar.com/ws');

    // When connection opens
    socket.addEventListener('open', () => {
      console.log('connected to server');
      socket.send('hello from browser');
    });

    // When a message comes in
    socket.addEventListener('message', (event) => {
      console.log('message from server:', event.data);
      event.data = JSON.parse(event.data);

      document.getElementById('message-box').innerHTML = event.data.message;
    });

    // When the connection closes
    socket.addEventListener('close', () => {
      waitTime*=2;
      console.log('connection closed, waiting for ', waitTime, 'ms');
      setTimeout(connect, );
    });

    // When something goes wrong
    socket.addEventListener('error', (err) => {
      console.error('WebSocket error', err);
    });

    // You can send later too:
    function sendSomething() {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({type: 'ping', time: Date.now()}));
      }
    }
  }
</script>
</body>
</html>
