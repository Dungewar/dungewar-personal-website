<!-- Modal -->
<div class="modal fade" id="emailSubscribeModal" tabindex="-1" aria-labelledby="emailSubscribeLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 id="emailSubscribeLabel" class="modal-title">Sign up for updates</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="emailSubForm">
                <div class="modal-body">
                    <input class="form-control" type="email" name="email" placeholder="you@example.com" required>
                    <div class="form-text">We’ll send occasional updates.</div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
                    <button class="btn btn-primary" type="submit">Confirm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'emailSubForm') return;
    e.preventDefault();
    const fd = new FormData(e.target);
    const email = fd.get('email');
    try {
      const res = await fetch('/api/email-list-subscribe', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email })
      });
      if (!res.ok) throw new Error('Request failed');
      // Close modal on success
      const modalEl = document.getElementById('emailSubscribeModal');
      bootstrap.Modal.getOrCreateInstance(modalEl).hide();
      alert('Subscribed!'); // swap for a prettier toast later
    } catch (err) {
      alert('Sorry, failed to subscribe.');
      console.error(err);
    }
  });
</script>
